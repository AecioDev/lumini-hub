host: localhost:4000
info:
  contact: {}
  description: Gateway unificado de entrada do ERP Lumini Hub, gerenciando roteamento
    de microsserviços.
  title: Lumini Hub ERP - API Gateway
  version: "1.0"
paths:
  /audit-logs/entity-types:
    get:
      description: Valores distintos de entidade (users, companies...) para o filtro
        da tela.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
      summary: Tipos de entidade da auditoria
      tags:
      - Auditoria
  /audit-logs/filter:
    post:
      consumes:
      - application/json
      description: Lista paginada das escritas feitas no sistema (quem, o quê, quando),
        com filtros por texto, entidade, método, usuário e período.
